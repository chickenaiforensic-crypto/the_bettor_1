<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Rating — live, from your data</title>
<style>
/* ============================================================
   PITCH RATING v3 — skin layer (Phase 6/8; replaceable)
   Design: dark premium default + light editorial toggle.
   Surface never speaks backend: no store/hash/key/engine jargon.
   ============================================================ */
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a323d; --line2:#39424f;
  --ink:#e8ecf1; --ink2:#aab3c0; --muted:#7d8794; --dim:#5d6772;
  --accent:#2fbf71; --accent2:#1d9a5a; --teal:#2fb3a6; --amber:#e8a33d; --red:#e05b5b;
  --h:#2fbf71; --d:#c9a227; --a:#e05b5b;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f1f3f6; --line:#e3e6ea; --line2:#d3d8de;
  --ink:#171c23; --ink2:#3d4651; --muted:#6b7480; --dim:#98a0ab;
  --accent:#128a4e; --accent2:#0f6b3d; --teal:#0e7a70; --amber:#b4740e; --red:#c0392b;
  --h:#128a4e; --d:#a8870f; --a:#c0392b;
  --shadow:0 8px 24px rgba(20,30,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding:0 0 60px;min-height:100vh;transition:background .25s ease,color .25s ease}
button{font-family:inherit;cursor:pointer}
select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:18px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);position:sticky;top:0;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);z-index:50}
.brand{display:flex;align-items:baseline;gap:10px}
.wordmark{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:-.3px;
  background:linear-gradient(100deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ver{font-size:11px;font-weight:700;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
  border-radius:99px;padding:2px 8px;letter-spacing:.4px}
.topbar-right{display:flex;align-items:center;gap:12px}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.status-dot.green{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.status-dot.amber{background:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 22%,transparent)}
.status-dot.grey{background:var(--dim)}

/* ---------- buttons / pills / chips ---------- */
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:10px;
  padding:8px 14px;font-size:13.5px;font-weight:600;transition:all .15s ease}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06120b;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.06);color:#06120b}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.swap{margin-top:2px;width:100%}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line2);color:var(--ink2)}
.accent-pill{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.muted-pill{background:color-mix(in srgb,var(--dim) 18%,transparent);border-color:var(--line2);color:var(--dim)}
.warn-pill{background:color-mix(in srgb,var(--amber) 14%,transparent);border-color:color-mix(in srgb,var(--amber) 40%,transparent);color:var(--amber)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;
  padding:3px 9px;font-size:11.5px;color:var(--ink2);background:var(--panel)}
.chip:hover{border-color:var(--line2);color:var(--ink)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:300px 1fr;gap:22px;max-width:1240px;margin:26px auto 10px;
  padding:0 clamp(16px,4vw,40px);align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.picker.card{position:sticky;top:84px}
@media(max-width:900px){.picker.card{position:static}}
.picker h2{font-size:15px;letter-spacing:-.2px;margin-bottom:14px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:5px}
.fld select{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  border-radius:10px;padding:9px 10px;font-size:14px;outline:none;transition:border .15s}
.fld select:focus{border-color:var(--accent)}
input.search{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  border-radius:10px;padding:9px 11px;font-size:14px;outline:none;margin-bottom:12px;transition:border .15s}
input.search:focus{border-color:var(--accent)}
input.search::placeholder{color:var(--dim)}
.srec{font-size:12.5px;color:var(--ink2);padding:2px 2px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 40%,transparent)}
.srec .rec b{font-variant-numeric:tabular-nums}
.srec + .secrow{border-top:none}
details.graph{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:2px 4px}
details.graph summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink2);padding:9px 10px;list-style:none;display:flex;align-items:center;gap:8px}
details.graph summary::before{content:"▸";color:var(--accent);transition:transform .18s ease}
details.graph[open] summary::before{transform:rotate(90deg)}
details.graph summary:hover{color:var(--ink)}
details.graph[open] .sec-body{padding:4px 10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 8px}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}

/* ---------- fixture card ---------- */
.stage{min-width:0}
.fixture-head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}
.comp{font-size:12px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.teams{display:flex;align-items:center;gap:16px}
.team{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.4px;flex:1;line-height:1.15}
.vs{color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase}
.pathline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;margin-bottom:16px}
.reason{white-space:nowrap}

.sections .sec{padding:14px 0;border-top:1px dashed var(--line)}
.sections .sec:first-of-type{border-top:none;padding-top:2px}
.sec h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
  display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec .cap{font-weight:600;letter-spacing:.3px;text-transform:none;color:var(--dim);font-size:11px;
  border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.sec-body{color:var(--ink2);font-size:14px}

/* probabilities */
.prob .pbar{display:flex;height:46px;border-radius:12px;overflow:hidden;gap:2px;background:var(--panel2)}
.bar-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;min-width:56px;transition:flex .3s ease}
.bar-seg.h{background:linear-gradient(180deg,var(--h),color-mix(in srgb,var(--h) 70%,#000))}
.bar-seg.d{background:linear-gradient(180deg,var(--d),color-mix(in srgb,var(--d) 70%,#000))}
.bar-seg.a{background:linear-gradient(180deg,var(--a),color-mix(in srgb,var(--a) 70%,#000))}
.pmeta{margin-top:8px;font-size:12.5px}

/* markets */
.markets .mrow,.formrow,.bal-row,.secrow{display:flex;align-items:center;gap:10px;padding:7px 2px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.markets .mrow:last-child{border-bottom:none}
.markets .mrow span{flex:1}
.markets .mrow b{min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.warn{color:var(--amber);font-size:12px}

/* scorelines */
.scoreline b{font-size:19px}
.score-chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.score-chip{border:1px solid var(--line2);border-radius:9px;padding:5px 10px;font-size:13px;
  font-variant-numeric:tabular-nums;background:var(--panel2)}

/* stars */
.stars{color:var(--amber);letter-spacing:2px}
.starsrow{display:flex;gap:22px;flex-wrap:wrap}

/* zone read */
.zone-wrap .zone-big{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.zone-big b{font-variant-numeric:tabular-nums}
.bal .bal-row span{width:52px;font-size:12.5px}
.balbar{flex:1;height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bal-fill{height:100%;border-radius:99px;transition:width .4s ease}
.bal-fill.h{background:var(--h)}.bal-fill.d{background:var(--d)}.bal-fill.a{background:var(--a)}
.bal .bal-row b{min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.small{font-size:12px}
.dim{color:var(--muted)}

/* paths table */
.secrow .sname{flex:1;font-weight:600;font-size:13px}
.secrow .sval{min-width:120px;text-align:right;font-variant-numeric:tabular-nums}
.secrow.total{border-top:1px solid var(--line2);font-weight:700;margin-top:6px;padding-top:10px}

/* form */
.formrow .fteam{flex:1;font-weight:600;font-size:13px}
.frm{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;
  font-size:11px;font-weight:800;color:#fff;margin-right:3px}
.frm.w{background:var(--h)}.frm.d{background:var(--d)}.frm.l{background:var(--a)}

/* venue */
.pin{filter:saturate(.9)}

/* confidence line */
.confline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);
  padding-top:14px;margin-top:6px}
.confline b{font-size:16px;font-variant-numeric:tabular-nums;min-width:40px}
.meter{flex:1;max-width:180px;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.meter-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .4s ease}

.card-foot{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.provenance{font-size:11.5px;line-height:1.5;border:1px dashed color-mix(in srgb,var(--accent) 35%,transparent);
  background:color-mix(in srgb,var(--accent) 5%,transparent);border-radius:9px;padding:7px 11px;margin-bottom:14px}
.note{font-size:12px}

/* empty / nocall */
.empty{padding:60px 20px;text-align:center}
.empty h2{font-family:var(--serif);font-size:20px;margin-bottom:8px}
.nocall{text-align:center;padding:34px 10px}
.nocall-icon{font-size:34px;margin-bottom:10px;opacity:.85}
.nocall h2{font-family:var(--serif);font-size:19px;margin-bottom:8px}
.nocall p{max-width:520px;margin:4px auto}

/* tabs */
.tabs{display:flex;gap:4px;max-width:1240px;margin:20px auto 0;padding:0 clamp(16px,4vw,40px);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
  font-size:13.5px;font-weight:600;padding:10px 12px;transition:all .15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* console */
.console{max-width:1240px;margin:18px auto 0;padding:0 clamp(16px,4vw,40px)}
.console-card{padding:18px}
.console-tabs-wrap{margin-bottom:12px}
.console-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.console-tabs .tab{border:none;border-bottom:2px solid transparent;padding:8px 12px}
.console-body{font-size:13.5px;color:var(--ink2)}
.console-body h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:18px 0 8px}
.cov-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.cov-row:last-child{border-bottom:none}
.cov-main{flex:1;min-width:0}
.cov-main b{display:block;font-size:13.5px;color:var(--ink)}
.cov-main .dim{font-size:12px}
.dropzone{border:2px dashed var(--line2);border-radius:12px;padding:28px;text-align:center;color:var(--muted);
  font-size:13.5px;transition:all .2s;margin-bottom:12px}
.dropzone.over{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.staged{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.staged-info{flex:1;min-width:0}
.staged-info b{display:block;font-size:13px}
.staged-info .dim{font-size:12px}
.hold-list{max-height:180px;overflow:auto;border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);background:color-mix(in srgb,var(--amber) 6%,transparent);border-radius:8px;margin-top:6px;padding:6px 9px}
.hold-line{font-size:12px;color:var(--ink2);padding:2px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 40%,transparent)}
.hold-line:last-child{border-bottom:none}
.replay-report{border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 6%,transparent);
  border-radius:12px;padding:14px;margin:14px 0;font-size:13px}
.replay-report .ok{color:var(--accent);font-weight:600;margin-top:6px}
.provenance-panel{border:1px dashed color-mix(in srgb,var(--accent) 35%,transparent);border-radius:8px;padding:8px 12px;margin:8px 0;background:color-mix(in srgb,var(--card) 85%,transparent);font-size:11.5px;line-height:1.5}
.provenance-panel b{font-weight:600}
.provenance-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid color-mix(in srgb,var(--line) 30%,transparent);padding:3px 0}
.provenance-row:last-child{border-bottom:none}

  .league-pivot-panel{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--panel);font-size:12px}
  .league-pivot-row{display:flex;gap:8px;align-items:center;margin:3px 0;font-variant-numeric:tabular-nums}
  .league-pivot-row b{width:220px}
  .integrity-flags-panel{border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:10px;padding:12px 14px;margin:12px 0;background:color-mix(in srgb,var(--amber) 6%,transparent);font-size:12.5px}
  .integrity-flag{border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent);padding:6px 0}
  .integrity-flag:last-child{border-bottom:none}

  .settlement-entry{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--panel)}
  .settlement-entry.win{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
  .settlement-entry.loss{border-color:color-mix(in srgb,var(--red) 35%,transparent);background:color-mix(in srgb,var(--red) 5%,transparent)}
  .settlement-inputs{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
  .settlement-inputs input{width:60px;padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--ink);font-variant-numeric:tabular-nums}
  .venue-guard-panel{border:1px solid color-mix(in srgb,var(--red) 35%,transparent);border-radius:10px;padding:10px 12px;margin:10px 0;background:color-mix(in srgb,var(--red) 6%,transparent);font-size:12.5px}
  .venue-guard-ok{border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
  .integrity-flag .tag{font-weight:700}
  .integrity-severity-high{color:var(--red)}
  .integrity-severity-med{color:var(--amber)}
  .integrity-severity-low{color:var(--muted)}

  .busy-icon{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .live-constants-panel{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--card);font-size:12px}
  .live-constants-row{display:flex;gap:8px;align-items:center;margin:4px 0}
  .live-constants-row label{width:120px;font-weight:600}
  .live-constants-row input{width:100px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
  .live-constants-row .dim{font-size:11px}

.ladder-tbl{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums;margin:8px 0}
.ladder-tbl th,.ladder-tbl td{padding:3px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent);text-align:right}
.ladder-tbl th:first-child,.ladder-tbl td:first-child{text-align:left}
.ladder-tbl tr.full td{font-weight:700;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.ladder-note{font-size:12px;color:var(--ink2);margin:4px 0}
/* country-scope clear control (WO-SCOPE-CLEAR-01) */
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);border-color:color-mix(in srgb,var(--red) 45%,transparent);color:var(--red)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.danger:disabled{opacity:.4;cursor:not-allowed}
.scope-summary{font-size:14px;font-weight:700;margin:8px 0 4px}
.scope-rows{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0 12px}
.scope-rows .srow{display:flex;gap:12px;padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent);font-size:12.5px;font-variant-numeric:tabular-nums}
.scope-rows .srow span:first-child{min-width:88px}
.scope-rows .srow span:nth-child(2){flex:1}
.scope-list{columns:2;font-size:12.5px;margin:4px 0 10px;padding-left:18px}
.scope-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.fld.chk{display:flex;gap:8px;align-items:center;font-size:12.5px}
.fld.chk input{width:auto}
details.scope-country{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--panel)}
details.scope-country>summary{cursor:pointer;list-style:none;padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:13.5px;flex-wrap:wrap}
details.scope-country>summary::before{content:"▸";color:var(--accent);transition:transform .18s ease}
details.scope-country[open]>summary::before{transform:rotate(90deg)}
.scope-comps{padding:4px 8px 8px 24px}
.cov-comp{cursor:pointer}
.cov-comp:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}

/* footer */
.footer{display:flex;justify-content:space-between;gap:14px;max-width:1240px;margin:30px auto 0;
  padding:18px clamp(16px,4vw,40px);border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);flex-wrap:wrap}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line2);color:var(--ink);border-radius:12px;padding:12px 18px;font-size:13.5px;
  box-shadow:var(--shadow);z-index:100;transition:opacity .35s ease;max-width:90vw}
.toast.out{opacity:0}

/* a11y focus */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ==== canon.js ==== */
/* ============================================================================
 * PR.canon — one canonicalizer, one esc(), identity resolution
 * Phase 1 · WO §7 ("All user- or data-derived strings pass through the one esc()")
 * Rule: every name variant resolves to exactly one identity row (Dynamo-Moscow class).
 * ==========================================================================*/
'use strict';

var PR = window.PR || (window.PR = {});

  /* --- accent folding table (kept small but sufficient for pack alphabets) --- */
  var FOLD = {
    'á': 'a', 'à': 'a', 'â': 'a', 'ã': 'a', 'ä': 'a', 'å': 'a', 'ā': 'a', 'ă': 'a', 'ą': 'a',
    'é': 'e', 'è': 'e', 'ê': 'e', 'ë': 'e', 'ē': 'e', 'ė': 'e', 'ę': 'e', 'ě': 'e',
    'í': 'i', 'ì': 'i', 'î': 'i', 'ï': 'i', 'ī': 'i', 'į': 'i', 'ı': 'i',
    'ó': 'o', 'ò': 'o', 'ô': 'o', 'õ': 'o', 'ö': 'o', 'ø': 'o', 'ō': 'o', 'ő': 'o',
    'ú': 'u', 'ù': 'u', 'û': 'u', 'ü': 'u', 'ū': 'u', 'ů': 'u', 'ű': 'u',
    'ý': 'y', 'ÿ': 'y', 'ç': 'c', 'ć': 'c', 'č': 'c', 'ď': 'd', 'đ': 'd', 'ñ': 'n', 'ń': 'n', 'ň': 'n',
    'š': 's', 'ś': 's', 'ř': 'r', 'ť': 't', 'ž': 'z', 'ź': 'z', 'ż': 'z', 'ľ': 'l', 'ł': 'l',
    'æ': 'ae', 'œ': 'oe', 'ß': 'ss', 'þ': 'th', 'ð': 'd'
  };

  function foldAccents(s) {
    return String(s == null ? '' : s).replace(/[^\x00-\x7F]/g, function (ch) {
      return FOLD[ch] || ch;
    });
  }

  /** Canonical key: folded, lowercased, non-alnum collapsed to single space. */
  function canon(s) {
    return foldAccents(String(s == null ? '' : s))
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .trim()
      .replace(/\s+/g, ' ');
  }

  /** HTML escape — the ONE esc(). Every user- or data-derived string passes here before innerHTML. */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
      .replace(/`/g, '&#96;');

  function slug(s) {

  }

  function identityKey(name) { return 'id:' + canon(name); }

    if (!c) return null;
    var list = store.identities;
    for (var i = 0; i < list.length; i++) {
      var id = list[i];

  function allNames(id) {

    (id.aliases || []).forEach(function (a) { if (out.indexOf(a) === -1) out.push(a); });
    return out;
  }

  return {
    foldAccents: foldAccents,
    canon: canon,
    esc: esc,
    slug: slug,
    matchFingerprint: matchFingerprint,
    identityKey: identityKey,
    resolveIdentity: resolveIdentity,
    allNames: allNames

})();

  /* ---------------- validation ---------------- */
  /** todayISO is passed in (determinism: no hidden new Date inside compute paths).

    opts = opts || {};

    var staged = { identities: [], matches: [], seasons: [], venues: [], sources: [], notes: [], ctxFlags: [], mutes: [], forms: [] };
    var seen = {};

    if (!parsed.valid) { errors.push('File is not a BP-TEAM-PACK v2 block (header not found).'); return { ok: false, errors: errors, holds: [], staged: null }; }

    parsed.rows.forEach(function (r) {
      if (r.error) { errors.push('Line ' + r.lineNo + ': ' + r.error); return; }
      var g = GRAMMAR[r.type];
      /* FORM is an extension outside Annex B (Z-2026-08-02-003): the shipped packs
         carry a 14-field legacy shape. Accept leniently, store verbatim as an
         artifact, never a compute input. No-abolition: nothing dropped. */
      if (g.lenient && r.fields.length < g.required.length + 2) {
        errors.push('Line ' + r.lineNo + ': FORM row too short (' + r.fields.length + ' fields).');
        return;
      }
      /* v1 legacy seeds carry fewer trailing fields (no sourceId/founded/website).
         Enforce REQUIRED fields strictly; trailing optional fields may be absent
         (v1 compatibility, no-abolition: present fields kept verbatim). */
      if (!g.lenient && r.fields.length < g.required.length) {
        errors.push('Line ' + r.lineNo + ': ' + r.type + ' row has ' + r.fields.length + ' fields, needs at least ' + g.required.length + '. Row rejected back — never truncated.');
        return;
      }
      var rec = {};
      if (g.lenient) {
        /* FORM: first 3 fields team|label|date; the rest stored verbatim */
        rec.team = r.fields[0] || '';
        rec.label = r.fields[1] || '';
        rec.date = r.fields[2] || '';
        rec.raw = r.fields.slice(3);
      } else if (r.type === 'MATCH' && parsed.version === 'v1') {
        /* v1 legacy MATCH: no compType field — remap positions (v1 grammar) */
        var f1 = v1MatchFields(r.fields);
        g.fields.forEach(function (f, i) { rec[f] = (f1[i] == null ? '' : String(f1[i]).trim()); });
      } else if (r.type === 'TEAM' && parsed.version === 'v1') {
        /* v1 legacy TEAM: no leagueCode field — remap, derive code from leagueName */
        var f2 = v1TeamFields(r.fields);
        g.fields.forEach(function (f, i) { rec[f] = (f2[i] == null ? '' : String(f2[i]).trim()); });
      } else {
        g.fields.forEach(function (f, i) { rec[f] = (r.fields[i] == null ? '' : String(r.fields[i]).trim()); });
      }

      /* legacy v1 canonicalization at read time (no-abolition: fields kept verbatim) */
      if (r.type === 'MATCH') {
        if (parsed.version === 'v1' && !rec.compType) {

        } else {
          rec.compType = canonCompType(rec.compType);
        }
        rec.competitionName = canonCompName(rec.competitionName, rec.compType);
      }
      if (r.type === 'TEAM') {
        rec.leagueCode = canonLeagueCode(rec.leagueCode);
        /* NA/unresolvable leagueCode on shipped seeds: keep verbatim, mark
           league-unassigned (ZONES v0.14 documented class: "14 embedded-seed
           stub identities remain league-less by design"). New researcher packs
           run strict and must carry a real code (Annex A: never NA). */
        if (!rec.leagueCode) {
          if (opts.strict === false) warnings.push('Line ' + r.lineNo + ': TEAM "' + rec.name + '" has no league code (legacy NA) — kept verbatim, league-unassigned.');
          else errors.push('Line ' + r.lineNo + ': TEAM leagueCode is mandatory, never NA.');
        }
      }

      /* completeness: every computation-relevant field must be populated (Annex A).
         leagueCode exempted from the hard check when loading legacy seeds
         (strict:false) — those are handled as league-unassigned warnings below. */
      g.required.forEach(function (f) {
        if (f === 'leagueCode' && opts.strict === false) return;
        if (rec[f] === '' || rec[f] == null) errors.push('Line ' + r.lineNo + ': ' + r.type + ' row missing required field "' + f + '".');
      });

      if (r.type === 'TEAM') {
        if (rec.leagueCode === 'NA' || rec.leagueCode === '') errors.push('Line ' + r.lineNo + ': TEAM leagueCode is mandatory, never NA.');
        if (!Number.isFinite(Number(rec.capacity)) && rec.capacity !== '') warnings.push('Line ' + r.lineNo + ': capacity "' + rec.capacity + '" not numeric — kept verbatim, noted.');
      }
      if (r.type === 'MATCH') {
        if (!ISO_DATE.test(rec.dateISO)) errors.push('Line ' + r.lineNo + ': MATCH date "' + rec.dateISO + '" is not ISO (YYYY-MM-DD).');
        else if (todayISO && rec.dateISO > todayISO) errors.push('Line ' + r.lineNo + ': MATCH date ' + rec.dateISO + ' is in the future (forbidden; today is the gather date).');
        if (COMP_TYPES.indexOf(rec.compType) === -1) errors.push('Line ' + r.lineNo + ': compType "' + rec.compType + '" not in grammar set.');
        ['homeGoals','awayGoals'].forEach(function (k) {

        }

      if (r.type === 'SEASON') {
        ['P','W','D','L','GF','GA','HP','HW','HD','HL','HGF','HGA','AP','AW','AD','AL','AGF','AGA'].forEach(function (k) {

        });

      }

      }

        if (!ISO_DATE.test(rec.date)) errors.push('Line ' + r.lineNo + ': MUTE date "' + rec.date + '" not ISO.');
      }
      if (r.type === 'FORM') {
        if (!ISO_DATE.test(rec.date)) errors.push('Line ' + r.lineNo + ': FORM date "' + rec.date + '" not ISO.');
      }

      if (!errors.length || true) { // staging continues; commit refuses on errors

    var tieMap = {};
    staged.matches.forEach(function (m) {

      }

    Object.keys(tieMap).forEach(function (k) {
      if (tieMap[k].length === 2) return;

    });

      var h = C.canon(m.home), a = C.canon(m.away);
      var pairKey = [h, a].sort().join('~');

      if (!pairMap[k]) pairMap[k] = [];
      pairMap[k].push(m);

    Object.keys(pairMap).forEach(function (k) {
      var legs = pairMap[k];
      if (legs.length !== 2) return;

      if (!shared) {
        holds.push('Two-leg tie "' + k + '" has per-leg tieIds (' + legs[0].tieId + ' / ' + legs[1].tieId + ') instead of one shared tieId. Rows kept verbatim (Z-003); grouped for 90-min doctrine by competition+pair.');
      }
    });

    return { ok: errors.length === 0, errors: errors, holds: holds, warnings: warnings, staged: staged };
  }

      });

        report.notes++;
      });
      staged.ctxFlags.forEach(function (c) {
        store.ctxFlags.push({ id: STORE.nextId(store, 'c'), team: c.team, date: c.date || null, flag: c.flag, detail: c.detail || null, sourceId: c.sourceId || null });
        report.ctx++;
      });

    'league two': { code: 'E3', name: 'England League Two' },
    'la liga': { code: 'SP1', name: 'Spain La Liga' },
    'bundesliga': { code: 'D1', name: 'Germany Bundesliga' },
    'serie a': { code: 'I1', name: 'Italy Serie A' },
    'ligue 1': { code: 'F1', name: 'France Ligue 1' },

    'kosovo superliga': 'KOS', 'albanian superliga': 'ALB', 'danish superliga': 'DEN',
    'league of ireland premier division': 'IRL', 'nifl premiership': 'NIR',
    'serbian superliga': 'SRB', 'ekstraklasa': 'POL', 'slovenian prva liga': 'SVN',
    'cypriot first division': 'CYP', 'swedish allsvenskan': 'SWE',

/* ============================================================================
 * PR.elo — causal Elo chain + performance ratings, PORTED from app-v2.9.9
 * (CALIBRATION-8, shipped v2.8.7): K=20, home +65, star = clamp((elo−1420)/2,
 * 0..100), performance window = rolling last-6, cold start (<3 recent games)
 * = no reading. Demote-only inputs; never boosts.
 * ==========================================================================*/

  var C = PR.canon;

  /**
   * Build the causal Elo map over matches strictly BEFORE cutoff (date < cutoff),
   * muted rows carry zero evidence (beforeCutoff choke point).
   * Returns { elo: {id:rating}, star: {id:0..100} }.
   */

    var ms = store.matches.filter(function (m) {
      return !m.muted && m.dateISO && (!cutoff || m.dateISO < cutoff) &&
        typeof m.homeGoals === 'number' && typeof m.awayGoals === 'number';
    }).sort(function (a, b) { return a.dateISO < b.dateISO ? -1 : a.dateISO > b.dateISO ? 1 : 0; });

    var E = {};
    ms.forEach(function (m) {
      var eh = E[m.homeId] || ELO.INIT, ea = E[m.awayId] || ELO.INIT;
      var p = 1 / (1 + Math.pow(10, -((eh + ELO.HF - ea) / 400)));
      var sc = m.homeGoals > m.awayGoals ? 1 : m.homeGoals < m.awayGoals ? 0 : 0.5;

      E[m.awayId] = ea + ELO.K * ((1 - sc) - (1 - p));

    return { elo: E, star: stars };
  }

  /** Performance read for a fixture pair at a cutoff (CAL8 perfRatings port).
   *  Returns { starH, starA, home:{n,sos,perf}|null, away:{...}|null }. */

    var fitState = fit(store, cutoff);

      }).sort(function (a, b) { return a.dateISO < b.dateISO ? -1 : a.dateISO > b.dateISO ? 1 : 0; }).slice(-ELO.PERF_WINDOW);

    }
    return {
      starH: fitState.star[homeId] != null ? fitState.star[homeId] : star(ELO.INIT),
      starA: fitState.star[awayId] != null ? fitState.star[awayId] : star(ELO.INIT),

})();

    catalog.forEach(function (r) {

/* ============================================================================
 * PR.scope — Country-Scope Clear Control (WO-SCOPE-CLEAR-01, v3.6.x)
 * A GENERIC, store-derived per-country + per-competition scope model:
 * list → preview → MUTE (soft, reversible) / PURGE (hard, backup-gated,
 * atomic, auditable). ZERO per-country code: countries/competitions come ONLY
 * from the store. Two levels (D1): a country scope {country, competition:null}
 * or a single competition {country, competition:'<competition name>'}. (No country/league
 * names are hardcoded anywhere — everything is derived from the store, gate G10.)
 * Ordering (D3): every listed collection is A–Z by display name; counts are
 * shown next to names; sorting never changes content.
 * No-abolition doctrine: MUTE is the soft path (rows stay visible, excluded);
 * PURGE is the owner-commissioned hard path for wrong data, gated on an
 * auto-downloaded backup (undo = load that backup through the migration
 * feature), with pre/post audit entries and idempotent no-op behaviour.
 * ==========================================================================*/
'use strict';

var PR = window.PR || (window.PR = {});
PR.scope = (function () {

  var C = PR.canon, STORE = PR.store;

  var MULTI = 'Multi-country / other';
  var UNASSIGNED = 'Unassigned';

  function byId(store, id) {
    for (var i = 0; i < store.identities.length; i++) if (store.identities[i].id === id) return store.identities[i];
    return null;
  }

  /* Country of a match: m.country when present; else home/away identity
     countries when they agree; else Multi-country; no identities → Unassigned. */
  function matchCountry(store, m) {
    var c = String(m.country == null ? '' : m.country).trim();
    if (c && c !== 'NA' && c !== 'unknown' && c !== 'none') return c;
    var h = m.homeId ? byId(store, m.homeId) : null;
    var a = m.awayId ? byId(store, m.awayId) : null;
    if (!h && !a) return UNASSIGNED;
    if (h && a && h.country && a.country && h.country === a.country) return h.country;
    return MULTI;
  }

  /* Scope list, 100% store-derived. Country list A–Z (D3); each country carries
     its competitions (counts) also A–Z. */
  function deriveScopes(store, derived) {
    var scopes = {}, order = [];
    store.matches.forEach(function (m) {
      var c = matchCountry(store, m);
      if (!scopes[c]) { scopes[c] = { country: c, competitions: {}, matches: [], total: 0, muted: 0 }; order.push(c); }
      var s = scopes[c];
      s.total++; if (m.muted) s.muted++;
      s.matches.push(m.id);
      var comp = m.competitionName || '(no competition)';
      s.competitions[comp] = (s.competitions[comp] || 0) + 1;
    });
    order.forEach(function (c) {
      var s = scopes[c];
      s.clubIds = [];
      store.identities.forEach(function (id) { if (id.country === c) s.clubIds.push(id.id); });
      s.clubCount = s.clubIds.length;

      s.competitionList = Object.keys(s.competitions).map(function (k) { return { name: k, count: s.competitions[k] }; })
        .sort(function (a, b) { return a.name.localeCompare(b.name); });

  }

  /* THE ONE selection function — preview, confirm and the mutations all read it
     (single source of truth, G-a11). scopeObj = {country, competition|null} or a
     plain country string (backward compatible). */
  function selection(store, derived, scopeObj) {
    var so = typeof scopeObj === 'string' ? { country: scopeObj, competition: null } : (scopeObj || {});
    var country = so.country, competition = so.competition || null;
    var scopes = deriveScopes(store, derived);

    var compCounts = {};
    matches.forEach(function (m) { var k = m.competitionName || '(no competition)'; compCounts[k] = (compCounts[k] || 0) + 1; });

    var clubIds = store.identities.filter(function (id) { return id.country === country; }).map(function (id) { return id.id; });
    var clubSet = {}; clubIds.forEach(function (id) { clubSet[id] = 1; });

    var remaining = store.matches.filter(function (m) { return !inScope[m.id] || (competition && (m.competitionName || '(no competition)') !== competition); });
    function refs(id) {
      var n = 0;
      remaining.forEach(function (m) { if (m.homeId === id || m.awayId === id) n++; });
      store.seasons.forEach(function (s) { if (s.teamId === id) n++; });
      store.venues.forEach(function (v) { if (v.teamId === id) n++; });
      store.ctxFlags.forEach(function (f) { if (f.teamId === id) n++; });

    function nameOf(id) { var it = byId(store, id); return it ? it.name : id; }
