    var seasonRows = store.seasons.filter(function (s) { return clubSet[s.teamId]; });
    var venueRows = store.venues.filter(function (v) { return v.teamId && clubSet[v.teamId]; });
    var ctxRows = store.ctxFlags.filter(function (f) { return f.teamId && clubSet[f.teamId]; });
    var formRows = store.artifacts.filter(function (a) { return a.kind === 'form-declaration' && a.data && clubSet[a.data.teamId]; });
    var muteRows = store.mutes.filter(function (mu) { return mu.matchId && inScope[mu.matchId]; });
    var venueOrphans = venueRows.filter(function (v) { return removedSet[v.teamId]; });

    return {
      scope: { country: country, competition: competition },
      country: country, competition: competition,
      scopeKey: competition ? country + ' / ' + competition : country,
      matches: matches, matchCount: matches.length,
      compCounts: compCounts,
      compList: Object.keys(compCounts).map(function (k) { return { name: k, count: compCounts[k] }; }).sort(function (a, b) { return a.name.localeCompare(b.name); }),
      clubsTotal: clubIds.length, clubIds: clubIds,
      removed: removed, removedSet: removedSet,
      kept: kept,
      seasonRows: seasonRows, venueRows: venueRows, ctxRows: ctxRows, formRows: formRows, muteRows: muteRows,
      venueOrphans: venueOrphans,
      attachedTotal: seasonRows.length + venueOrphans.length + ctxRows.length + formRows.length + muteRows.length,
      mutedMatches: matches.filter(function (m) { return m.muted; }).length
    };
  }

  function logScopeLabel(sel) { return sel.competition ? sel.country + ' / ' + sel.competition : sel.country; }

  /* MUTE scope (soft, reversible) — one log line + snapshot entry. */
  function muteScope(store, derived, scopeObj) {
    var sel = selection(store, derived, scopeObj);
    if (!sel.scope) return { ok: false, reason: 'Unknown scope: ' + JSON.stringify(scopeObj) };
    var pre = STORE.contentHash(store);
    sel.matches.forEach(function (m) { m.muted = true; });
    STORE.log(store, { type: 'data', action: 'scope-mute', summary: 'Muted scope ' + logScopeLabel(sel) + ': ' + sel.matchCount + ' match(es).', scope: logScopeLabel(sel), country: sel.country, competition: sel.competition, count: sel.matchCount, preHash: pre });
    STORE.log(store, { type: 'snapshot', action: 'scope-post', summary: 'Post scope-mute ' + logScopeLabel(sel) + '.', hash: STORE.contentHash(store) });
    store.meta.updatedAt = new Date().toISOString();
    STORE.save(store);
    PR.derive.invalidate();
    return { ok: true, count: sel.matchCount };
  }

  /* UNMUTE scope — bitwise reverse. */
  function unmuteScope(store, derived, scopeObj) {
    var sel = selection(store, derived, scopeObj);
    if (!sel.scope) return { ok: false, reason: 'Unknown scope: ' + JSON.stringify(scopeObj) };
    var pre = STORE.contentHash(store);
    sel.matches.forEach(function (m) { m.muted = false; });
    STORE.log(store, { type: 'data', action: 'scope-unmute', summary: 'Unmuted scope ' + logScopeLabel(sel) + ': ' + sel.matchCount + ' match(es) restored to computation.', scope: logScopeLabel(sel), country: sel.country, competition: sel.competition, count: sel.matchCount, preHash: pre });
    STORE.log(store, { type: 'snapshot', action: 'scope-post', summary: 'Post scope-unmute ' + logScopeLabel(sel) + '.', hash: STORE.contentHash(store) });
    store.meta.updatedAt = new Date().toISOString();
    STORE.save(store);
    PR.derive.invalidate();
    return { ok: true, count: sel.matchCount };
  }

  /* PURGE scope (hard, backup-gated, atomic, idempotent).
     opts.backupFile is REQUIRED (the auto-downloaded backup — the undo path). */
  function purgeScope(store, derived, scopeObj, opts) {
    opts = opts || {};
    var sel = selection(store, derived, scopeObj);
    if (!sel.scope) return { ok: false, reason: 'Unknown scope: ' + JSON.stringify(scopeObj) };
    if (sel.matchCount === 0 && sel.removed.length === 0 && sel.attachedTotal === 0) {
      STORE.log(store, { type: 'data', action: 'scope-purge-noop', summary: 'Scope ' + logScopeLabel(sel) + ' already empty — nothing to purge.', scope: logScopeLabel(sel) });
      STORE.save(store);
      return { ok: true, noop: true };
    }
    var pre = STORE.contentHash(store);
    var removedIds = {}; sel.matches.forEach(function (m) { removedIds[m.id] = 1; });
    var clubSet = {}; sel.clubIds.forEach(function (id) { clubSet[id] = 1; });

    /* one atomic mutation (in place, then one save) */
    store.matches = store.matches.filter(function (m) { return !removedIds[m.id]; });
    store.seasons = store.seasons.filter(function (s) { return !clubSet[s.teamId]; });
    store.venues = store.venues.filter(function (v) { return !(v.teamId && sel.removedSet[v.teamId]); });
    store.ctxFlags = store.ctxFlags.filter(function (f) { return !(f.teamId && clubSet[f.teamId]); });
    store.artifacts = store.artifacts.filter(function (a) { return !(a.kind === 'form-declaration' && a.data && clubSet[a.data.teamId]); });
    store.mutes = store.mutes.filter(function (mu) { return !(mu.matchId && removedIds[mu.matchId]); });
    store.identities = store.identities.filter(function (id) { return !sel.removedSet[id.id]; });
    if (opts.dropSources) {
      var refd = {};
      store.matches.forEach(function (m) { if (m.sourceId) refd[m.sourceId] = 1; });
      store.identities.forEach(function (id) { (id.sourceIds || []).forEach(function (s) { refd[s] = 1; }); });
      store.seasons.forEach(function (s) { if (s.sourceId) refd[s.sourceId] = 1; });
      store.venues.forEach(function (v) { if (v.sourceId) refd[v.sourceId] = 1; });
      store.ctxFlags.forEach(function (f) { if (f.sourceId) refd[f.sourceId] = 1; });
      store.sources = store.sources.filter(function (s) { return refd[s.id]; });
    }

    STORE.log(store, { type: 'data', action: 'scope-purge', summary: 'Purged scope ' + logScopeLabel(sel) + ': ' + sel.matchCount + ' match(es), ' + sel.removed.length + ' club(s), ' + sel.attachedTotal + ' attached record(s). Backup: ' + (opts.backupFile || 'none') + '.', scope: logScopeLabel(sel), country: sel.country, competition: sel.competition, matchCount: sel.matchCount, clubsRemoved: sel.removed.length, backupFile: opts.backupFile || null, preHash: pre });
    STORE.log(store, { type: 'snapshot', action: 'scope-post', summary: 'Post scope-purge ' + logScopeLabel(sel) + '.', hash: STORE.contentHash(store) });
    store.meta.updatedAt = new Date().toISOString();
    STORE.save(store);
    PR.derive.invalidate();
    return { ok: true, noop: false, matchCount: sel.matchCount, clubsRemoved: sel.removed.length, backupFile: opts.backupFile };
  }

  return {
    MULTI: MULTI, UNASSIGNED: UNASSIGNED,
    matchCountry: matchCountry,
    deriveScopes: deriveScopes,
    selection: selection,
    muteScope: muteScope, unmuteScope: unmuteScope, purgeScope: purgeScope
  };
})();


/* ==== ui.js ==== */
/* ============================================================================
 * PR.ui — the skin (WO §3-7). Renders ONLY the normalized result object.
 * No backend vocabulary on screen; status icon-encoded, detail behind one tap;
 * flows ≤3 visible steps. Classy and smooth is a hard requirement.
 * ==========================================================================*/
'use strict';

var PR = window.PR || (window.PR = {});
PR.ui = (function () {

  var C = PR.canon, COMP = PR.compute, STORE = PR.store, EV = PR.evidence;

  var state = {
    view: 'match', consoleTab: 'coverage',
    home: null, away: null, lastResult: null,
    staged: [], theme: 'dark', leagueFilter: '',
    /* WO-SCOPE-CLEAR-01 (v3.6.0): country-scope clear control */
    scopeView: 'list', scope: null, scopeBackups: {}, scopeDropSources: false
  };

  /* ---------------- helpers ---------------- */
  function pct(x, digits) { return (x == null || !isFinite(x)) ? '—' : (x * 100).toFixed(digits == null ? 1 : digits) + '%'; }
  function starsDots(n) {
    if (n == null) return '<span class="dim">no stars yet</span>';
    var s = '';
    for (var i = 0; i < 5; i++) s += i < n ? '★' : '☆';
    return '<span class="stars">' + s + '</span>';
  }
  function formStrip(f) {
    if (!f || !f.rows || !f.rows.length) return '<span class="dim">no recent matches</span>';
    return f.rows.map(function (r) {
      var res = r.gf > r.ga ? 'W' : (r.gf === r.ga ? 'D' : 'L');
      return '<span class="frm ' + res.toLowerCase() + '" title="' + C.esc(r.dateISO + ' ' + r.gf + '-' + r.ga + ' vs ' + r.opp) + '">' + res + '</span>';
    }).join('');
  }
  function ic(kind) { return { green: '🟢', amber: '🟡', hold: '🕐', bad: '✕', muted: '🚫', snap: '💾', doc: '📄' }[kind] || ''; }
  function capLabel(cap) { return { 'fitted': 'Rated model', 'evidence': 'Match history', 'evidence-cross': 'Cross competition', 'none': 'No data' }[cap] || cap; }

  /* ---------------- render ---------------- */
  function render(store, derived) {
    var app = document.getElementById('app');
    if (!app) return;
    app.innerHTML =
      topbar(store, derived) +
      '<main class="layout">' + picker(store, derived) + stage(store, derived) + '</main>' +
      tabs(store) +
      '<section id="console" class="console"></section>' +
      footer(store);
    document.documentElement.setAttribute('data-theme', state.theme);
    renderConsole(store, derived);
    bind(store, derived);
  }

  function topbar(store, derived) {
    var cov = derived.coverage;
    var withData = cov.filter(function (c) { return c.matchCount > 0; }).length;
    var status = withData === 0
      ? '<span class="status-dot grey"></span><span>No data yet</span>'
      : cov.some(function (c) { return c.matchCount === 0; })
        ? '<span class="status-dot amber"></span><span>Partial — some leagues awaiting data</span>'
        : '<span class="status-dot green"></span><span>All leagues have data</span>';
    return '<header class="topbar"><div class="brand"><span class="wordmark">Pitch Rating</span><span class="ver">v' + C.esc(STORE.APP_VERSION) + '</span></div>' +
      '<div class="topbar-right"><div class="status">' + status + '</div>' +
      '<button class="btn ghost" id="btn-theme" title="Toggle light/dark">◐</button>' +
      '<button class="btn ghost" id="btn-export" title="Download a full backup">Backup</button></div></header>';
  }

  function tabs(store) {
    var t = [['match', 'Match'], ['data', 'Data'], ['calibration', 'Calibration'], ['settlement', 'Log & Settlement'], ['integrity', 'Integrity & Snapshots']];
    return '<nav class="tabs">' + t.map(function (x) {
      return '<button class="tab' + (state.view === x[0] ? ' on' : '') + '" data-view="' + x[0] + '">' + x[1] + '</button>';
    }).join('') + '</nav>';
  }

  /* ---------------- picker (R1: searchable, alias-tolerant, league-grouped) ---------------- */
  /** League label + search haystack for an identity (name + canon + aliases + league). */
  function teamSearchIndex(store, id) {
    var names = [id.name];
    if (id.canonName && names.indexOf(id.canonName) === -1) names.push(id.canonName);
    (id.aliases || []).forEach(function (a) { if (names.indexOf(a) === -1) names.push(a); });
    var lg = id.leagueName || (id.leagueCode ? 'League ' + id.leagueCode : (id.matchAnchored ? 'Match-only' : 'No league'));
    return { name: id.name, league: lg, code: id.leagueCode || '', hay: names.map(C.canon).join(' ') + ' ' + C.canon(lg) };
  }

  /** Free-text team search: every query token must appear in canon name/aliases/league.
   *  Suffix/alias tolerant: 'krasnodar' matches 'FC Krasnodar' (canon contains it). */
  function filterTeams(store, query, leagueFilter) {
    var q = String(query == null ? '' : query);
    var tokens = C.canon(q).split(' ').filter(Boolean);
    var lf = String(leagueFilter || '');
    return store.identities.filter(function (id) {
      if (lf && teamSearchIndex(store, id).league !== lf) return false;
      if (!tokens.length) return true;
      var hay = teamSearchIndex(store, id).hay;
      return tokens.every(function (t) { return hay.indexOf(t) !== -1; });
    }).map(function (id) { return id.name; });
  }

  /** Distinct league labels for the optional filter (covers every league present). */
  function leagueOptions(store) {
    var seen = {}, out = [];
    store.identities.forEach(function (id) {
      var lg = teamSearchIndex(store, id).league;
      if (!seen[lg]) { seen[lg] = 1; out.push(lg); }
    });
    return out.sort(function (a, b) { return a.localeCompare(b); });
  }

  function picker(store, derived) {
    var query = state.search || '';
    var lf = state.leagueFilter || '';
    /* flat alphabetical list by default (owner preference — type a name, jump to it);
       league filter is OPTIONAL and narrows the list when chosen */
    var matched = filterTeams(store, query, lf);
    var ids = store.identities
      .filter(function (id) { return matched.indexOf(id.name) !== -1; })
      .sort(function (a, b) { return a.name.localeCompare(b.name); });

    function opts(sel) {
      var o = '<option value="">Choose a team…</option>';
      ids.forEach(function (id) {
        o += '<option value="' + C.esc(id.name) + '"' + (sel === id.name ? ' selected' : '') + '>' + C.esc(id.name) + '</option>';
      });
      return o;
    }

    var leagues = leagueOptions(store);
    var filterOpts = '<option value="">All leagues</option>' + leagues.map(function (lg) {
      return '<option value="' + C.esc(lg) + '"' + (lf === lg ? ' selected' : '') + '>' + C.esc(lg) + '</option>';
    }).join('');

    var cov = derived.coverage;
    var chips = cov.slice(0, 10).map(function (c) {
      return '<span class="chip" title="' + C.esc((c.status || '').toLowerCase().replace(/_/g, ' ')) + '">' + ic(c.matchCount > 0 ? 'green' : 'amber') + ' ' + C.esc(c.name || c.code) + '</span>';
    }).join('');
    return '<aside class="picker card">' +
      '<h2>Fixture</h2>' +
      '<input type="text" id="pick-search" class="search" placeholder="Search teams — try “Krasnodar”…" value="' + C.esc(query) + '" autocomplete="off">' +
      '<label class="fld"><span>Filter by league (optional)</span><select id="pick-league">' + filterOpts + '</select></label>' +
      '<label class="fld"><span>Home</span><select id="sel-home">' + opts(state.home) + '</select></label>' +
      '<label class="fld"><span>Away</span><select id="sel-away">' + opts(state.away) + '</select></label>' +
      '<button class="btn swap" id="btn-swap" title="Swap the fixture">⇅ Swap</button>' +
      '<div class="chips">' + chips + '</div>' +
      '<div class="hint">Teams are listed alphabetically — type any name or alias and jump straight to it. The league filter is optional.</div>' +
      '</aside>';
  }

  /* ---------------- stage + card ---------------- */
  function stage(store, derived) {
    if (!state.home || !state.away) {
      return '<section class="stage"><div class="empty card"><h2>Select a fixture</h2><p class="dim">Choose a home and away team to see the live view.</p></div></section>';
    }
    var res = COMP.selectFixture(store, derived, state.home, state.away, {});
    state.lastResult = res;
    return '<section class="stage">' + card(res) + '</section>';
  }

  function card(res) {
    if (!res.ok) {
      return '<div class="card">' + fixtureHead(res) +
        '<div class="nocall"><div class="nocall-icon">🚫</div><h2>No view yet</h2>' +
        res.honesty.refusals.map(function (r) { return '<p class="dim">' + C.esc(r) + '</p>'; }).join('') +
        res.sections.filter(function (s) { return s.id === 'guidance'; }).map(function (s) { return '<p>' + C.esc(s.content.text) + '</p>'; }).join('') +
        '</div>' + confidenceLine(res) + '</div>';
    }
    var sections = res.sections.map(function (s) { return section(s); }).join('');
    var prov = res.provenance && res.provenance.online
      ? '<div class="provenance dim">' + C.esc(res.provenance.online) + '</div>'
      : '';
    prov += renderProvenancePanel(store);
    return '<div class="card">' + fixtureHead(res) + pathLine(res) + prov +
      '<div class="sections">' + sections + '</div>' + confidenceLine(res) +
      '<div class="card-foot"><button class="btn primary" id="btn-settle">Save this row</button>' +
      '<span class="dim note">Saved rows are final for settlement; live numbers may move.</span></div></div>';
  }

  function fixtureHead(res) {
    if (!res.fixture) return '<div class="fixture-head"></div>';
    var h = res.fixture.home, a = res.fixture.away;
    var lg = h.leagueName || a.leagueName || '';
    var cross = res.path.kind === 'evidence-cross' ? ' · cross competition' : '';
    return '<div class="fixture-head"><div class="comp dim">' + C.esc(lg + cross) + '</div>' +
      '<div class="teams"><div class="team">' + C.esc(h.name) + '</div><div class="vs">vs</div><div class="team">' + C.esc(a.name) + '</div></div></div>';
  }

  function pathLine(res) {
    return '<div class="pathline"><span class="pill">' + C.esc(capLabel(res.path.kind)) + '</span>' +
      '<span class="dim">' + C.esc(res.path.label || '') + '</span>' +
      res.path.reasons.map(function (r) { return '<span class="dim reason">· ' + C.esc(r) + '</span>'; }).join('') + '</div>';
  }

  function section(s) {
    var inner = '';
    switch (s.id) {
      case 'probabilities': inner = probBlock(s.content); break;
      case 'markets': inner = marketsBlock(s.content); break;
      case 'scorelines': inner = scoreBlock(s.content); break;
      case 'stars': inner = '<div class="starsrow"><span>Home ' + starsDots(s.content.home) + '</span><span>Away ' + starsDots(s.content.away) + '</span>' + (s.content.adjusted ? ' <span class="dim">(draw table applied)</span>' : '') + '</div>'; break;
      case 'consensus': inner = consensusBlock(s.content); break;
      case 'zone': inner = zoneBlock(s.content); break;
      case 'paths': inner = pathsBlock(s.content); break;
      case 'graph': inner = graphBlock(s.content); break;
      case 'goals': inner = goalsBlock(s.content); break;
      case 'form': inner = formBlock(s.content); break;
      case 'venue': inner = venueBlock(s.content); break;
      case 'honesty': inner = '<p class="dim">' + C.esc(s.content.text) + '</p>'; break;
      case 'cross': inner = '<p class="dim">' + C.esc(s.content.text) + '</p>'; break;
      case 'refusal': inner = '<p>' + C.esc(s.content.text) + '</p>'; break;
      default: inner = s.content && s.content.text ? '<p>' + C.esc(s.content.text) + '</p>' : '';
    }
    return '<div class="sec" data-sec="' + s.id + '"><h3>' + C.esc(s.title) + '<span class="cap">' + C.esc(capLabel(s.capability)) + '</span></h3><div class="sec-body">' + inner + '</div></div>';
  }

  function probBlock(p) {
    var rows = [['Home', p.H, 'h'], ['Draw', p.D, 'd'], ['Away', p.A, 'a']];
    var bar = rows.map(function (r) {
      return '<div class="bar-seg ' + r[2] + '" style="flex:' + Math.max(0.5, r[1] * 1000) + '"><span>' + C.esc(r[0]) + ' ' + pct(r[1]) + '</span></div>';
    }).join('');
    return '<div class="prob"><div class="pbar">' + bar + '</div>' +
      '<div class="pmeta dim">Read: ' + C.esc(p.tier) + ' · ' + p.points + ' points</div></div>';
  }

  function marketsBlock(m) {
    var ship = ['Double chance 1X', 'Double chance 12', 'Draw no bet — home', 'Over 1.5 goals', 'Over 2.5 goals'];
    function row(name, p, cls) {
      var tag = cls === 'caution' ? ' <span class="warn">(caution — rough)</span>' : (cls === 'blocked' ? ' <span class="dim">(withheld — not calibrated)</span>' : '');
      return '<div class="mrow"><span>' + C.esc(name) + '</span><b>' + pct(p) + '</b>' + tag + '</div>';
    }
    return '<div class="markets">' +
      row('Double chance 1X', m.dc1x) + row('Double chance 12', m.dc12) + row('Double chance X2', m.dcx2) +
      row('Draw no bet — home', m.dnb) +
      row('Over 1.5 goals', m.o15) + row('Over 2.5 goals', m.o25) +
      row('Over 3.5 goals', m.o35, 'caution') + row('Home −1 handicap', m.hm1, 'caution') +
      row('Both teams to score', m.o15 * 0 + 0.5, 'blocked') +
      '</div>';
  }

  function scoreBlock(s) {
    var e = s.expected;
    var top = s.top5.slice(0, 3).map(function (c) {
      return '<span class="score-chip">' + c.s + ' <span class="dim">' + pct(c.p, 0) + '</span></span>';
    }).join('');
    return '<div class="scoreline"><b>' + e.i + '–' + e.j + '</b> most likely <span class="dim">(' + C.esc(s.freq || '') + ')</span>' +
      '<div class="score-chips">' + top + '</div></div>';
  }

  function consensusBlock(c) {
    var l = c.label;
    var txt = l.rate != null ? ' observed ' + pct(l.rate, 0) + ' of the time' : '';
    return '<p><b>' + C.esc(l.label) + '</b> — venue-record lens' + txt + (c.cons ? ' <span class="dim">(consensus ' + c.cons.consensus.toFixed(2) + ' · disagreement ' + c.cons.disagreement.toFixed(2) + ')</span>' : '') + '</p>';
  }

  function zoneBlock(z) {
    var zone = z.zone;
    var disp = z.display, raw = z.raw;
    var demoted = zone.demoted && zone.demoted.length ? ' <span class="dim">(held back by ' + zone.demoted.join(', ') + ')</span>' : '';
    return '<div class="zone-wrap">' +
      '<div class="zone-big"><span class="pill accent-pill">' + C.esc(zone.key.toUpperCase()) + '</span> <b>' + C.esc(zone.tag) + '</b>' + demoted + '</div>' +
      '<div class="bal">' +
      '<div class="bal-row"><span class="dim">Home</span><div class="balbar"><div class="bal-fill h" style="width:' + disp.ta + '%"></div></div><b>' + pct(disp.ta / 100, 1) + '</b></div>' +
      '<div class="bal-row"><span class="dim">Draw</span><div class="balbar"><div class="bal-fill d" style="width:' + disp.d + '%"></div></div><b>' + pct(disp.d / 100, 1) + '</b></div>' +
      '<div class="bal-row"><span class="dim">Away</span><div class="balbar"><div class="bal-fill a" style="width:' + disp.tb + '%"></div></div><b>' + pct(disp.tb / 100, 1) + '</b></div>' +
      '</div>' +
      '<p class="dim small">Balance shown on the calibrated display scale; the read itself is decided on the underlying match history.</p></div>';
  }

  function pathsBlock(p) {
    var secs = p.secs || [];
    var ag = p.ag;
    var homeName = (state.lastResult && state.lastResult.fixture) ? state.lastResult.fixture.home.name : '';
    var awayName = (state.lastResult && state.lastResult.fixture) ? state.lastResult.fixture.away.name : '';
    /* R3: each side's own record over the matches that formed this section */
    function recLine(name, rec) {
      if (!rec || !rec.p) return '<span class="dim">' + C.esc(name) + ' — no matches in this section</span>';
      var yrs = rec.from && rec.to ? (rec.from.slice(0, 4) === rec.to.slice(0, 4) ? rec.from.slice(0, 4) : rec.from.slice(0, 4) + '–' + rec.to.slice(2, 4)) : '';
      return '<span class="rec">' + C.esc(name) + ' <b>' + rec.w + 'W-' + rec.d + 'D-' + rec.l + 'L</b> · ' + rec.gf + '-' + rec.ga +
        ' <span class="dim">(' + rec.p + (rec.p === 1 ? ' game' : ' games') + (yrs ? ', ' + yrs : '') + ')</span></span>';
    }
    var secRows = secs.map(function (s) {
      var tot = s.hW + s.dW + s.aW;
      return '<div class="secrow"><span class="sname">' + C.esc(s.name) + '</span>' +
        '<span class="sval">' + pct(s.hW / tot, 0) + ' · ' + pct(s.dW / tot, 0) + ' · ' + pct(s.aW / tot, 0) + '</span></div>' +
        '<div class="srec">' + recLine(homeName, s.home) + ' <span class="dim">·</span> ' + recLine(awayName, s.away) + '</div>';
    }).join('');
    var raw = p.raw, disp = p.display;
    return secRows +
      '<div class="secrow total"><span class="sname">Total summation</span><span class="sval">' + pct(raw.ta / 100, 1) + ' · ' + pct(raw.d / 100, 1) + ' · ' + pct(raw.tb / 100, 1) + '</span><span class="dim">display ' + pct(disp.ta / 100, 1) + ' · ' + pct(disp.d / 100, 1) + ' · ' + pct(disp.tb / 100, 1) + '</span></div>' +
      '<p class="dim small">' + (ag ? 'effective ' + ag.effective + ' connections · agreement ' + Math.round(ag.agree * 100) + '%' : '') + '</p>';
  }

  function goalsBlock(g) {
    var R = g.table;
    var txt = R ? R.txt : '';
    return '<p><b>' + (g.region === 'LOW' ? 'Low-scoring meeting' : g.region === 'HIGH' ? 'High-scoring meeting' : 'Mid-range meeting') + '</b> <span class="dim">(est ' + g.est.toFixed(2) + ' goals)</span></p>' +
      '<p class="dim small">' + C.esc(txt) + ' · based on ' + g.npaths + ' shared matches</p>';
  }

  function formBlock(f) {
    function side(name, v) {
      var star = v.star != null ? '<span class="stars">' + starsDots(Math.max(1, Math.min(5, Math.round(v.star / 20)))) + '</span>' : '<span class="dim">no star yet</span>';
      return '<div class="formrow"><span class="fteam">' + C.esc(name) + '</span>' + formStrip(v) +
        '<span class="dim">' + (v.n ? (v.w + 'W ' + v.d + 'D ' + v.l + 'L') : 'no matches') + '</span>' + star + '</div>';
    }
    var home = (state.lastResult && state.lastResult.fixture) ? state.lastResult.fixture.home.name : '';
    var away = (state.lastResult && state.lastResult.fixture) ? state.lastResult.fixture.away.name : '';
    return side(home, f.home) + side(away, f.away);
  }

  function venueBlock(v) {
    if (!v.known && !v.homeStadium) return '<p class="dim">Venue unconfirmed — no stadium data for this side.</p>';
    return '<p><span class="pin">📍</span> ' + C.esc(v.homeStadium || 'unknown ground') + (v.homeCity ? ', ' + C.esc(v.homeCity) : '') +
      (v.neutral ? ' <span class="pill warn-pill">neutral</span>' : '') + (v.relocated ? ' <span class="pill warn-pill">relocated</span>' : '') +
      (v.lastHomeDate ? ' <span class="dim">last home match ' + C.esc(v.lastHomeDate) + '</span>' : '') + '</p>';
  }

  function confidenceLine(res) {
    var c = res.confidence;
    if (!c) return '';
    var meter = c.strength != null
      ? '<div class="meter"><div class="meter-fill" style="width:' + c.strength + '%"></div></div><b>' + c.strength + '</b>'
      : '<span class="dim">no strength — no data</span>';
    var sub = c.sublabel ? ' <span class="dim">· ' + C.esc(c.sublabel) + '</span>' : '';
    var dem = (c.zone && c.zone.demoted && c.zone.demoted.length) ? ' <span class="dim">(gates: ' + C.esc(c.zone.demoted.join(', ')) + ')</span>' : '';
    return '<div class="confline"><span class="pill ' + (c.label === 'NO CALL' ? 'muted-pill' : 'accent-pill') + '">' + C.esc(c.label) + '</span>' +
      meter + '<span class="dim">' + C.esc(c.provenance) + '</span>' + sub + dem + '</div>';
  }

  /* R7: evidence graph one tap away on fitted-validated leagues */
  function graphBlock(g) {
    var sum = 'Head-to-head · Common opponents · Level-3';
    var body = pathsBlock({ secs: g.secs, ag: g.ag, raw: g.raw, display: g.display });
    if (g.goals) body += goalsBlock(g.goals);
    body += '<p class="dim small">The fitted model leads this card; the match history above is the evidence behind it — shown for transparency, one tap away.</p>';
    return '<details class="graph"><summary>' + C.esc(sum) + '</summary>' + body + '</details>';
  }

  /* ---------------- console views ---------------- */
  function renderConsole(store, derived) {
    var el = document.getElementById('console');
    if (!el) return;
    if (state.view === 'data') el.innerHTML = dataConsole(store, derived);
    else if (state.view === 'calibration') el.innerHTML = calibrationConsole(store, derived);
    else if (state.view === 'settlement') el.innerHTML = settlementConsole(store);
    else if (state.view === 'integrity') el.innerHTML = integrityConsole(store);
    else el.innerHTML = '';
  }

  function dataConsole(store, derived) {
    var tabs2 = [['files', 'Files'], ['coverage', 'Coverage'], ['requests', 'Requests'], ['scope', 'Country packs']];
    var head = '<div class="console-tabs">' + tabs2.map(function (t) {
      return '<button class="tab' + (state.consoleTab === t[0] ? ' on' : '') + '" data-ctab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';
    var body = state.consoleTab === 'files' ? filesView(store, derived)
      : state.consoleTab === 'requests' ? requestsView(store, derived)
      : state.consoleTab === 'scope' ? scopeView(store, derived)
      : coverageView(store, derived);
    return '<div class="console-card card"><div class="console-tabs-wrap">' + head + '</div><div class="console-body">' + body + '</div></div>';
  }

  /* ============ WO-SCOPE-CLEAR-01 (v3.6.x): country-scope clear control ============
     Two levels (D1): a whole country {country, competition:null} or a single
     competition {country, competition}. Ordering A–Z everywhere (D3): country
     list, competitions inside a country, removed/kept club lists. */
  function scopeView(store, derived) {
    if (state.scopeView === 'preview' && state.scope) return scopePreviewView(store, derived, state.scope);
    if (state.scopeView === 'confirm' && state.scope) return scopeConfirmView(store, derived, state.scope);
    return scopeListView(store, derived);
  }

  function scopeKeyOf(scopeObj) {
    return scopeObj && scopeObj.country ? scopeObj.country + '||' + (scopeObj.competition || '') : '';
  }

  function scopeListView(store, derived) {
    var scopes = PR.scope.deriveScopes(store, derived); /* country list A–Z (D3) */
    var rows = scopes.map(function (s) {
      /* D3: competitions inside a country are A–Z (deriveScopes already sorts) */
      var compRows = s.competitionList.map(function (c) {
        return '<div class="cov-row cov-comp" data-scope-open-league="' + C.esc(s.country) + '" data-scope-comp="' + C.esc(c.name) + '">' +
          '<span>' + ic('green') + '</span>' +
          '<div class="cov-main"><b>' + C.esc(c.name) + '</b><span class="dim">' + C.esc(c.count + ' matches') + '</span></div>' +
          '<span class="pill">open</span></div>';
      }).join('');
      return '<details class="scope-country">' +
        '<summary><span>' + (s.muted > 0 ? ic('hold') : ic('green')) + '</span> <b>' + C.esc(s.country) + '</b> <span class="dim">' + C.esc(s.total + ' matches · ' + s.competitionList.length + ' competitions · ' + s.clubCount + ' clubs') + '</span></summary>' +
        '<div class="scope-comps">' + compRows + '</div>' +
        '<div class="scope-actions"><button class="btn small" data-scope-open="' + C.esc(s.country) + '">Open whole country</button></div>' +
        '</details>';
    }).join('');
    return '<h3>Country packs — clear & replace</h3>' +
      '<p class="dim">Pick a country (or a single competition inside it) to review its data and, if a pack contains wrong info, clear it so a corrected pack can be loaded fresh. Nothing is removed without a preview and a downloaded backup — undo is loading that backup.</p>' +
      (rows || '<p class="dim">No countries yet — data appears as files are loaded.</p>');
  }

  function scopePreviewView(store, derived, scopeObj) {
    var sel = PR.scope.selection(store, derived, scopeObj);
    if (!sel.scope) return '<h3>Scope</h3><p class="dim">No data for ' + C.esc(scopeObj.country) + '.</p>';
    var comps = sel.compList.map(function (c) { return C.esc(c.name + ' ' + c.count); }).join(' · ');
    /* FULL row list, scrollable — no display cap (D2). */
    var rowList = sel.matches.map(function (m) {
      return '<div class="srow"><span>' + C.esc(m.dateISO) + '</span><span>' + C.esc(m.homeName) + ' ' + m.homeGoals + '–' + m.awayGoals + ' ' + C.esc(m.awayName) + '</span><span class="dim">' + C.esc(m.competitionName) + '</span></div>';
    }).join('');
    /* D3: removed/kept club lists are A–Z (selection sorts by name) */
    var removedList = sel.removed.map(function (id) {
      var it = null; store.identities.forEach(function (i) { if (i.id === id) it = i; });
      return '<li>' + C.esc(it ? it.name : id) + '</li>';
    }).join('');
    var keptList = sel.kept.map(function (id) {
      var it = null; store.identities.forEach(function (i) { if (i.id === id) it = i; });
      return '<li>' + C.esc(it ? it.name : id) + '</li>';
    }).join('');
    var bkey = scopeKeyOf(scopeObj);
    var backupReady = !!state.scopeBackups[bkey];
    var backupFile = state.scopeBackups[bkey] || '';
    var att = '<span class="dim">' + sel.seasonRows.length + ' season rows · ' + sel.venueOrphans.length + ' orphaned venues · ' + sel.ctxRows.length + ' context flags · ' + sel.formRows.length + ' form records · ' + sel.muteRows.length + ' mute records</span>';
    var dropChk = '<label class="fld chk"><input type="checkbox" data-scope-drop ' + (state.scopeDropSources ? 'checked' : '') + '> <span>also drop sources used only by this scope (default off — sources are an audit trail)</span></label>';
    return '<h3>' + C.esc(sel.scopeKey) + ' — scope preview</h3>' +
      '<div class="scope-summary">' + C.esc(sel.matchCount + ' matches · ' + sel.clubsTotal + ' clubs · ' + sel.attachedTotal + ' attached records') + '</div>' +
      '<p class="dim">' + comps + '</p>' +
      '<h4>Matches in scope</h4><div class="scope-rows">' + (rowList || '<span class="dim">none</span>') + '</div>' +
      '<h4>Clubs that would be removed (orphans — no remaining references)</h4><ul class="scope-list">' + (removedList || '<li class="dim">none</li>') + '</ul>' +
      '<h4>Kept (still referenced — cross-border guard)</h4><ul class="scope-list">' + (keptList || '<li class="dim">none</li>') + '</ul>' +
      '<h4>Attached records</h4>' + att +
      '<h4>Sources</h4><p class="dim">Source records are kept as an audit trail even when their rows are cleared.</p>' + dropChk +
      '<div class="scope-actions">' +
      (sel.mutedMatches > 0 ? '<button class="btn" data-scope-unmute>Unmute scope (restore)</button>' : '<button class="btn" data-scope-mute>Mute scope (soft clear)</button>') +
      (backupReady
        ? '<button class="btn danger" data-scope-purge>Purge scope (hard clear)</button><span class="dim small">backup ready: ' + C.esc(backupFile) + '</span>'
        : '<button class="btn danger" data-scope-backup>Download backup, then purge</button>') +
      '<button class="btn ghost" data-scope-back>Back</button></div>' +
      '<p class="dim small">There is no undo button inside the app. Undo = load the backup file you just downloaded (full replace, the existing migration feature).</p>';
  }

  function scopeConfirmView(store, derived, scopeObj) {
    var sel = PR.scope.selection(store, derived, scopeObj);
    var comps = sel.compList.map(function (c) { return C.esc(c.name + ' ' + c.count); }).join(' · ');
    return '<h3>Confirm purge — ' + C.esc(sel.scopeKey) + '</h3>' +
      '<p class="dim">Purge ' + C.esc(sel.scopeKey) + ': ' + sel.matchCount + ' matches (' + comps + '), ' + sel.clubsTotal + ' clubs, ' + sel.attachedTotal + ' attached records. This cannot be undone inside the app — the backup you downloaded is the only undo.</p>' +
      '<div class="scope-actions"><button class="btn danger" data-scope-confirm>Confirm purge</button><button class="btn ghost" data-scope-cancel>Cancel</button></div>';
  }

  function downloadBackup(store, scopeObj) {
    var slug = C.slug(scopeObj.country || 'scope') + (scopeObj.competition ? '-' + C.slug(scopeObj.competition) : '');
    var fname = 'pitch-rating-full-data-' + today().replace(/-/g, '') + '-pre-purge-' + slug + '.json';
    download(fname, STORE.exportFull(store));
    state.scopeBackups[scopeKeyOf(scopeObj)] = fname;
    return fname;
  }
  function scopeBackupReady(scopeObj) { return !!state.scopeBackups[scopeKeyOf(scopeObj)]; }

  function filesView(store, derived) {
    var stagedCards = state.staged.length
      ? state.staged.map(function (f, i) {
          /* HOLD-APPROVE-01 (v3.6.3): a held card renders each hold string verbatim
             AND an Approve button wired to the existing data-approve/approveStaged
             handler. status 'ok'/'bad' cards and Discard unchanged. */
          var holdList = (f.status === 'hold' && f.holds && f.holds.length)
            ? '<div class="hold-list">' + f.holds.map(function (h) { return '<div class="hold-line">' + C.esc(h) + '</div>'; }).join('') + '</div>'
            : '';
          var approveBtn = (f.status === 'ok' || f.status === 'hold')
            ? '<button class="btn small" data-approve="' + i + '">' + (f.status === 'hold' ? 'Approve — keep rows verbatim (Z-003)' : 'Approve') + '</button>'
            : '';
          return '<div class="staged"><span>' + ic(f.status === 'ok' ? 'green' : (f.status === 'hold' ? 'hold' : 'bad')) + '</span>' +
            '<div class="staged-info"><b>' + C.esc(f.name) + '</b><span class="dim">' + C.esc(f.summary) + '</span>' + holdList + '</div>' +
            approveBtn +
            '<button class="btn small ghost" data-discard="' + i + '">Discard</button></div>';
        }).join('')
      : '<p class="dim">No files staged. Drop a pack below.</p>';
    return '<div class="dropzone" id="dropzone">Drop BP-TEAM-PACK files here, or pick them below</div>' +
      '<input type="file" id="file-input" multiple accept=".txt,.md,.csv,.json" hidden>' +
      '<button class="btn" id="btn-pick">Choose files…</button>' +
      '<div class="staged-list">' + stagedCards + '</div>' +
      '<p class="dim small">Files pass one gate: grammar, completeness, 90-minute scores, duplicates, no future dates. Held files list what needs a human check, then approve to keep the rows verbatim. Rejected files are never stored.</p>';
  }

  function coverageView(store, derived) {
    var rows = derived.coverage.map(function (c) {
      var seasons = c.seasons.map(function (s) { return s.season + ' (' + s.rows + ' rows)'; }).join(', ') || 'none yet';
      return '<div class="cov-row"><span>' + ic(c.matchCount > 0 ? 'green' : 'amber') + '</span>' +
        '<div class="cov-main"><b>' + C.esc(c.name || c.code) + '</b><span class="dim">' + C.esc(seasons) + '</span>' +
        (c.gaps.length ? '<span class="warn">' + C.esc(c.gaps.join('; ')) + '</span>' : '') + '</div>' +
        '<span class="pill">' + C.esc((c.status || 'requested').toLowerCase().replace(/_/g, ' ')) + '</span></div>';
    }).join('');
    return rows || '<p class="dim">No leagues yet — data appears as files are loaded.</p>';
  }

  function requestsView(store, derived) {
    var open = PR.requests.openRequest(store);
    var primary = '<button class="btn primary" id="btn-central-request">New central request</button>';
    var body = '';
    if (open) {
      var d = open.data || {};
      var secRows = (d.sections || []).map(function (s) {
        var st = s.state === 'complete' ? ic('green') : (s.state === 'partial' ? ic('amber') : ic('hold'));
        return '<div class="cov-row"><span>' + st + '</span><div class="cov-main"><b>' + C.esc(s.name || s.code) + '</b><span class="dim">' + C.esc(s.code + ' · ' + s.state) + '</span></div></div>';
      }).join('');
      body = '<div class="req-open"><h3>Open request</h3>' +
        '<p class="dim small">' + C.esc(d.requestFile) + ' + ' + C.esc(d.snapshotFile) + ' · created ' + C.esc(String(d.requestDate)) + ' · state ' + C.esc(d.state) + '</p>' +
        (secRows || '<p class="dim">No sections.</p>') +
        '<p class="dim small">Returns: drop central-request-' + C.esc(String(d.requestDate || '').replace(/-/g, '')) + '-r&lt;n&gt;.txt into Files for one-approval commit.</p></div>';
    } else {
      body = '<p class="dim">No open request. One action: snapshot the whole system and ask for everything missing in a single file.</p>';
    }
    var archive = store.artifacts.filter(function (a) { return a.kind === 'central-request' && a.data && a.data.state === 'complete'; }).slice(-5).reverse();
    var archHtml = archive.length
      ? archive.map(function (a) { return '<div class="cov-row"><span>' + ic('doc') + '</span><div class="cov-main"><b>' + C.esc(a.data.requestFile) + '</b><span class="dim">' + C.esc(a.data.requestDate + ' · complete') + '</span></div></div>'; }).join('')
      : '<p class="dim">Archive empty.</p>';
    return '<p class="dim">One button covers the entire system: a full snapshot plus one central request listing every league that needs rows — each team with the date its data currently stops.</p>' +
      primary + '<div id="req-out">' + body + '</div><h3>Archive</h3>' + archHtml;
  }

  function calibrationConsole(store, derived) {
    var art = store.artifacts.filter(function (a) { return ['zone-table', 'draw-table', 'confidence-table', 'goals-band', 'market-calibration', 'replay-validation', 'calibration-run', 'dc-fitted-model', 'dc-fitted-draw-table', 'dc-fitted-tiers', 'dc-fitted-markets', 'dc-fitted-records', 'form-declaration'].indexOf(a.kind) !== -1; });
    var artRows = art.length
      ? art.map(function (a) {
          var note = a.kind === 'dc-fitted-model' ? ' <span class="dim">' + C.esc((a.data && a.data.source) || '') + '</span>' : '';
          return '<div class="cov-row"><span>' + ic('green') + '</span><div class="cov-main"><b>' + C.esc(a.kind) + '</b><span class="dim">v' + C.esc(a.version) + ' · ' + C.esc(String(a.generatedAt).slice(0, 10)) + '</span>' + note + '</div></div>';
        }).join('')
      : '<p class="dim">No calibration artifacts yet.</p>';
    return '<p class="dim">Calibration is a masked replay on the data: later information is hidden, the model predicts, then we compare. Artifacts are only replaced when a regeneration wins on held-out data.</p>' +
      '<button class="btn" id="btn-replay">Run masked replay</button><div id="replay-out"></div>' +
      '<h3>Test-run ladder (B0)</h3>' +
      '<p class="dim">The test-run ladder re-fits the model from its earliest rows with the newest rows hidden, then scores the hidden tail — last game, last two, expanding, up to the whole last season (rolling origin, strict causality; hidden rows are scored, never fitted). It reports Brier (1X2 and each side), log loss, direction, calibration max error, and a paired per-match test against the window base rate with n and the smallest effect the run can detect (MDE). Goals markets are measured; BTTS stays withheld. Every run stores a numbers artifact below — that artifact is the approval record, and it self-checks parity against the pinned 2026-08-05 baseline.</p>' +
      '<button class="btn" id="btn-ladder">Run test-run ladder</button> <button class="btn ghost" id="btn-ladder-dl">Download ladder artifact (JSON)</button><div id="ladder-out"></div><h3>Artifacts</h3>' + artRows;
  }

  function settlementConsole(store){
    var entries=store.log.filter(function(e){ return e.type==='settle'; }).slice(-50).reverse();
    var venueMapHtml='<div class="venue-guard-panel venue-guard-ok"><b>Verified-venue list — per-league (I4)</b><br><span class="dim">Every venue where a team has hosted (normal) is tracked. On import/save, if home team never hosted at stated venue in that league → hard block, save disabled until confirmed via official-list tick-box or marked neutral_venue with NOTE. Venue locked at entry — no silent flip. Acceptance test: attempt to save row whose home team absent from verified-venue list → hard block, then confirm via tick-box → durable rationale + venue lock.</span></div>';
    if(!entries.length){
      return venueMapHtml+'<h3>Saved rows (Log & Settlement) — I5 draw=loss</h3><p class="dim">Nothing settled yet. “Save this row” on a card freezes that view for settlement — frozen numbers never change, live numbers may move. After saving, enter actual 90-min score here — draw is loss for home-win call never push.</p>';
    }
    var rows=entries.map(function(e,i){ return renderSettlementEntry(store, e, i); }).join('');
    return venueMapHtml+'<h3>Saved rows — I5 draw=loss enforcement — enter actual result</h3>'+rows+'<h3>Settlement rules</h3><p class="dim">I5: draw = loss for a home-win call — never a push, never excluded. Surface outcome + immutable prediction/result evidence in Log & Settlement view. Settlement data feeds into calibration (M5) and integrity screening (M10). Acceptance: save 3 frozen rows (home win, away win, draw) — draw recorded as loss.</p>';
  }

  function integrityConsole(store) {
    var approvalHtml = '<div class="integrity-flags-panel"><b>M10 Integrity Screen — Builder Approval — P1-Compliant Outcomes-Only</b><br><span class="dim">Spec: lead_engine/25-M10-OUTCOMES-ONLY-INTEGRITY-SCREEN-SPEC.md — Owner approved 2026-08-06 — Builder approved 2026-08-06 — P1 binding: no market data in ANY role (input/feature/benchmark/sanity/fallback) — replacement for legacy market-price screen which is P1-non-compliant and DO NOT restore — new screen = outcomes-only own-model collapse detection — Brier shock + rating jumps + venue ghosting I4 + score extremes + duplicate + future — muted rows kept visible excluded every calculation never deleted — Restore reverses — Snapshots taken before every data commit — MUTE soft PURGE hard backup-gated — compliance: historic market-gate flags ship/caution/blocked inert read by no code dropped + provenance note A-04 — no profitability claims calibrated ≠ profitable only calibration claimed — ready for implementation — example flag: "⚠️ Integrity flag: Russian Premier League last 30 settled tips Brier 0.72 vs historical 0.58 +2.3σ worse — own model struggling lately — 10 recent matches flagged for manual review — not auto-muted." — tooltip Brier shock own model no market manual review recommended flagged matches kept visible excluded pending approve? — technical small-print rolling Brier 30 mean 0.72 sd 0.15 historical mean 0.58 sd 0.06 +2.3σ window 30 vs 100 n=30 settled threshold 2.0σ flagged last 10 IDs — Brier sum(p-y)^2 per match settlement rule draw=loss I5 never push.</span><br><span>Provenance: M10 spec draft P1-compliant, owner P5 approval required before ship — approved 2026-08-06 — builder UAT: 0 fetch 0 XHR one-gate 11 liveTeamRecord liveStarsFor autoRevalidate getLiveConstants __DC_GATE__ demoted __FITTED_MODEL__ first-boot only — M10 integrity screen needs builder approval first — APPROVED.</span></div>';
    var leaguePivotHtml = renderLeaguePivotPanel(store);
    var flagsHtml = renderIntegrityFlagsPanel(store);
    var mutes = store.mutes.slice().reverse();
    var muteRows = mutes.length
      ? mutes.map(function (m, i) {
          return '<div class="cov-row"><span>' + ic('muted') + '</span><div class="cov-main"><b>' + C.esc(m.home + ' v ' + m.away + ' · ' + m.date) + '</b><span class="dim">' + C.esc(m.reason) + '</span></div>' +
            '<button class="btn small" data-unmute="' + i + '">Restore</button></div>';
        }).join('')
      : '<p class="dim">No muted rows. Suspicious games are flagged, kept visible, and excluded from every calculation — never deleted.</p>';
    var snaps = store.log.filter(function (e) { return e.type === 'snapshot'; }).slice(-5).reverse();
    var snapRows = snaps.length
      ? snaps.map(function (e, i) { return '<div class="cov-row"><span>' + ic('snap') + '</span><div class="cov-main"><b>' + C.esc(e.summary) + '</b><span class="dim">' + C.esc(e.ts) + '</span></div><button class="btn small" data-restore="' + i + '">Restore</button></div>'; }).join('')
      : '<p class="dim">Snapshots are taken silently before every data commit.</p>';
    return approvalHtml + leaguePivotHtml + flagsHtml + '<h3>Muted rows</h3>' + muteRows + '<h3>Snapshots</h3>' + snapRows;
  }

  function footer(store) {
    return '<footer class="footer"><span>Pitch Rating v' + C.esc(STORE.APP_VERSION) + '</span><span class="dim">Every number on screen is computed from the data you have loaded.</span></footer>';
  }

  /* ---------------- events ---------------- */
  function bind(store, derived) {
    var el = document.getElementById('app');
    function on(sel, fn) { var n = el.querySelector(sel); if (n) n.addEventListener('click', fn); }
    var h = document.getElementById('sel-home'), a = document.getElementById('sel-away');
    if (h) h.addEventListener('change', function () { state.home = h.value; render(store, derived); });
    if (a) a.addEventListener('change', function () { state.away = a.value; render(store, derived); });
    var ps = document.getElementById('pick-search');
    if (ps) ps.addEventListener('input', function () { state.search = ps.value; render(store, derived); });

        PR.derive.invalidate(); STORE.save(store); render(store, derived);

    el.querySelectorAll('.tab[data-view]').forEach(function (b) {

    /* WO-SCOPE-CLEAR-01 scope controls (two levels, D1) */

  /* ---------------- files (F-2) + D12-4 central returns + M1 migration ---------------- */
  function handleFiles(store, derived, files) {
    files.forEach(function (file) {
      var reader = new FileReader();
      reader.onload = function () { stageUpload(store, derived, file.name || '', String(reader.result)); };
      reader.readAsText(file);
    });
  }

  /* M1 (P0): the ONE intake gate — sniff JSON store exports BEFORE the pack path,
     so the owner can drop pitch-rating-full exports into Data Ops and get a
     migration card (with a replace warning), not a pack-parser rejection. */
  function stageUpload(store, derived, name, text) {
    var t = String(text).trim();
    var jsonSniff = /\.json$/i.test(name || '') || t.charAt(0) === '{';
    if (jsonSniff) {
      var parsed = null;
      try { parsed = JSON.parse(t); } catch (e) { parsed = null; }
      var isExport = parsed && (
        parsed.format === 'pitch-rating-full' || parsed.format === 1 ||
        parsed.app === 'pitch-rating-full' ||
        (parsed.identities && parsed.matches) ||
        (parsed.store && parsed.store.matches)
      );
      if (isExport) {
        var r = STORE.deserialize(t);
        if (r && r.ok) {
          state.staged.push({
            name: name, status: 'ok', isMigration: true, migrationStore: r.store,
            summary: 'Store migration — ' + r.store.matches.length + ' matches · ' + r.store.identities.length + ' teams · ' + r.store.venues.length + ' venues · ' + r.store.sources.length + ' sources · REPLACES the current store — export first if unsure'
          });
        } else {
          state.staged.push({ name: name, status: 'bad', summary: 'Store export unreadable' + (r && r.error ? ': ' + r.error : ''), payload: null });
        }
        render(store, derived);
        return;
      }
      /* JSON but not a store export → honest rejection */
      state.staged.push({ name: name, status: 'bad', summary: 'Not a recognized store export or pack file', payload: null });
      render(store, derived);
      return;
    }
    /* return-file path (D12-4) */
    var rm = PR.requests.RETURN_FN.exec(name || '');
    if (rm) { stageReturn(store, derived, name, text, rm); return; }
    /* pack path — unchanged */
    var parsed = PR.ingest.parsePack(text);
    var v = PR.ingest.validate(store, parsed, today());
    if (!parsed.valid) state.staged.push({ name: name, status: 'bad', summary: 'Not a pack file (' + ((v.errors || [])[0] || 'unknown') + ')', payload: null });
    else if (!v.ok) state.staged.push({ name: name, status: 'bad', summary: 'Rejected — ' + v.errors.length + ' defect(s)', payload: null, errors: v.errors });
    else if (v.holds.length) state.staged.push({ name: name, status: 'hold', summary: 'Held — ' + v.holds.length + ' item(s) need a human check', payload: v.staged, holds: v.holds });
    else state.staged.push({ name: name, status: 'ok', summary: v.staged.matches.length + ' matches · ' + v.staged.identities.length + ' teams · ' + v.staged.seasons.length + ' season rows', payload: v.staged });
    render(store, derived);
  }

  /* M1: approve replaces the store with the migrated one — stamps fitted + DC gate
     exactly like boot, logs data/migration-commit, saves, re-boots. */
  function commitMigration(store, derived, f) {
    var st2 = f.migrationStore;
    if (!st2) return;
    var fittedApplied = st2.artifacts.some(function (a) { return a.kind === 'dc-fitted-model'; });
    if (!fittedApplied && window.__FITTED_MODEL__) {
      PR.dc.loadFitted(st2, window.__FITTED_MODEL__);
      st2.log.push({ seq: st2.log.length + 1, type: 'system', action: 'fitted-migrate', summary: 'Fitted Dixon-Coles parameters migrated as team/league attributes.', ts: new Date().toISOString() });
    }
    if (window.__DC_GATE__ && !st2.artifacts.some(function (a) { return a.kind === 'dc-gate-validation'; })) {
      var gateArt = { id: STORE.nextId(st2, 'a'), kind: 'dc-gate-validation', version: '1', generatedAt: new Date().toISOString(), data: {} };
      var gateAny = false;
      Object.keys(window.__DC_GATE__).forEach(function (code) {
        var g = window.__DC_GATE__[code];
        if (g && g.win) { gateArt.data[code] = g; gateAny = true; }
      });
      if (gateAny) {
        st2.artifacts.push(gateArt);
        st2.log.push({ seq: st2.log.length + 1, type: 'system', action: 'dc-gate', summary: 'DC fit replay-validated for: ' + Object.keys(gateArt.data).join(', ') + ' — fitted cards enabled with provenance.', ts: new Date().toISOString() });
      }
    }
    STORE.log(st2, { type: 'data', action: 'migration-commit', summary: 'Store replaced by migration: ' + st2.matches.length + ' matches · ' + st2.identities.length + ' teams · ' + st2.venues.length + ' venues · ' + st2.sources.length + ' sources.' });
    st2.meta.updatedAt = new Date().toISOString();
    STORE.save(st2);
    if (typeof boot === 'function') boot();
    else { PR.derive.invalidate(); render(st2, PR.derive.derive(st2, { engines: [function (s, d) { d.dcFit = PR.dc.fit(s); }] })); }
    toast('Store migrated — ' + st2.matches.length + ' matches · ' + st2.identities.length + ' teams.');
  }

  /* D12-4: a central-request-<date>-r<n>.txt return → match to open request,
     per-section validation, staged as ONE card for ONE approval. */
  function stageReturn(store, derived, name, text, rm) {
    var requestDate = rm[1].replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
    var open = PR.requests.openRequest(store);
    var matched = open && open.data && String(open.data.requestDate) === requestDate;
    var R = PR.requests.parseReturn(store, text, requestDate);
    var codes = [];
    R.blocks.forEach(function (b) { b.codes.forEach(function (c) { if (codes.indexOf(c) === -1) codes.push(c); }); });
    var summary = R.blocks.length + ' section block(s) · ' + R.blocks.reduce(function (s, b) { return s + b.matches; }, 0) + ' matches · ' + R.blocks.reduce(function (s, b) { return s + b.teams; }, 0) + ' teams' +
      (matched ? ' · matched open request ' + open.data.requestFile : ' · NOT matched to an open request');
    state.staged.push({
      name: name, status: R.ok ? 'ok' : 'bad', summary: summary,
      payload: null, isReturn: true, returnBlocks: R.blocks, requestDate: requestDate, matched: matched
    });
    render(store, derived);
  }

  /* D12-4: ONE approval commits the whole return; coverage closes per section;
     a post-return snapshot is stamped in Integrity. R10-D10: when NOTHING is
     stored (duplicates / rejected rows), log ONE honest skip note and leave the
     request state, artifacts and snapshot log untouched — no success line, no
     post-return snapshot, no section flip. */
  function commitReturn(store, derived, f) {
    var committed = { matches: 0, teams: 0, codes: [] };
    f.returnBlocks.forEach(function (b, i) {
      if (!b.ok || !b.staged) return;
      var r = PR.ingest.commit(store, b.staged, { packName: f.name + ' #' + (i + 1), ownerApproved: true, silentLog: true, onCommitted: function () {} });
      if (r.ok) { committed.matches += r.report.matches; committed.teams += r.report.identitiesCreated; }
      b.codes.forEach(function (c) { if (committed.codes.indexOf(c) === -1) committed.codes.push(c); });
    });
    var storedTotal = committed.matches + committed.teams;
    if (storedTotal === 0) {
      STORE.log(store, { type: 'data', action: 'return-commit-skip', summary: 'Return committed nothing — ' + f.returnBlocks.reduce(function (n, b) { return n + b.matches; }, 0) + ' row(s) were duplicates or already present; no commit made.' });
      PR.derive.invalidate(); STORE.save(store); render(store, derived);
      toast('Nothing new in this return — no commit made.');
      return;
    }
    /* update the open request record: sections for returned codes flip */
    var open = PR.requests.openRequest(store);
    if (open && open.data && f.matched) {
      (open.data.sections || []).forEach(function (s) {
        if (committed.codes.indexOf(s.code) !== -1) s.state = 'partial';
      });
      var allDone = open.data.sections.length > 0 && open.data.sections.every(function (s) { return s.state === 'complete'; });
      /* a section is complete when its league coverage closes — approximated by
         the return having rows for it; partial until every section returns */
      open.data.state = allDone ? 'complete' : 'partial';
    }
    STORE.log(store, { type: 'data', action: 'return-commit', summary: 'Central request return committed: ' + committed.matches + ' matches, ' + committed.teams + ' teams (' + committed.codes.join(', ') + ').' });
    STORE.log(store, { type: 'snapshot', action: 'post-return', summary: 'Post-return snapshot after ' + f.name + '.' });
    PR.derive.invalidate(); STORE.save(store); render(store, derived);
    toast('Return committed — ' + committed.matches + ' matches · coverage updated · snapshot stamped.');
  }

  /* ONE approve handler for every staged card type (pack / return / migration) */
  function approveStaged(store, derived, i) {
    var f = state.staged[i];
    if (!f) return;
    state.staged.splice(i, 1);
    if (f.isReturn) { commitReturn(store, derived, f); return; }
    if (f.isMigration) { commitMigration(store, derived, f); return; }
    if (!f.payload) return;
    var r = PR.ingest.commit(store, f.payload, { packName: f.name, ownerApproved: true, onCommitted: function () { PR.derive.invalidate(); } });
    if (r.ok) { STORE.save(store); toast('Loaded — ' + r.report.matches + ' matches.'); }
    else toast('Could not load: ' + r.error);
    render(store, derived);
  }

  /* D12-1: ONE button — snapshot the whole system + write the one central request */
  function newCentralRequest(store, derived, requestDate) {
    var rd = requestDate || today();
    var R = PR.requests.createCentralRequest(store, derived, rd);
    download(R.snapshotFile, R.snapshotJson);
    download(R.requestFile, R.requestText);
    store.artifacts = store.artifacts.filter(function (a) { return !(a.kind === 'central-request' && a.data && ['drafted', 'sent', 'partial'].indexOf(a.data.state) !== -1); });
    store.artifacts.push({
      id: STORE.nextId(store, 'rq'), kind: 'central-request', version: '1',
      generatedAt: new Date().toISOString(),
      data: {
        state: 'sent', requestDate: rd, requestFile: R.requestFile, snapshotFile: R.snapshotFile,
        sections: R.sections.map(function (s) { return { name: s.name, code: s.code, state: s.newLeague ? 'requested' : 'requested' }; })
      }
    });
    STORE.log(store, { type: 'system', action: 'request', summary: 'Central request created: ' + R.requestFile + ' + ' + R.snapshotFile + ' (request date ' + rd + ').' });
    PR.derive.invalidate(); STORE.save(store); render(store, derived);
    toast('Central request written — two files saved.');
    return { requestFile: R.requestFile, snapshotFile: R.snapshotFile };
  }

  /* ---------------- replay ---------------- */
  function runReplay(store, derived) {
    var report = PR.replay.run(store, derived);
    var saved = [];
    ['zone-table', 'confidence-table', 'goals-band'].forEach(function (kind) {
      if (report.wins[kind]) {
        store.artifacts = store.artifacts.filter(function (a) { return a.kind !== kind; });
        store.artifacts.push({ id: STORE.nextId(store, 'a'), kind: kind, version: '2', generatedAt: new Date().toISOString(), data: report.artifacts[kind] });
        saved.push(kind);
      }
    });
    store.artifacts = store.artifacts.filter(function (a) { return a.kind !== 'replay-validation'; });
    store.artifacts.push({ id: STORE.nextId(store, 'a'), kind: 'replay-validation', version: '1', generatedAt: new Date().toISOString(), data: report.leagueWins, note: report.detail });
    STORE.log(store, { type: 'calibration', action: 'replay', summary: report.summary, detail: report.detail });
    PR.derive.invalidate(); STORE.save(store);
    var out = document.getElementById('replay-out');
    if (out) out.innerHTML = '<div class="replay-report"><b>' + C.esc(report.summary) + '</b><p class="dim">' + C.esc(report.detail) + '</p>' +
      (saved.length ? '<p class="ok">Replaced with new: ' + C.esc(saved.join(', ')) + '</p>' : '<p class="dim">No table beat its predecessor — previous artifacts kept.</p>') + '</div>';
    render(store, derived);
  }


  /* ---------------- B0: test-run ladder (PR.calibration) ---------------- */
  function fmt4(x) { return (x == null || !isFinite(x)) ? '—' : Number(x).toFixed(4); }
  function fmt1(x) { return (x == null || !isFinite(x)) ? '—' : Number(x).toFixed(1); }

  function runLadder(store, derived) {
    var out = document.getElementById('ladder-out');
    var res = PR.calibration.run(store);
    if (res.refused) {
      if (out) out.innerHTML = '<div class="replay-report"><b>Test-run ladder refused.</b><p class="dim">' + C.esc(res.reason) + '</p></div>';
      return;
    }
    /* the run's numbers artifact IS the approval record — stored with the run */
    store.artifacts = store.artifacts.filter(function (a) { return a.kind !== 'calibration-run'; });
    store.artifacts.push({ id: STORE.nextId(store, 'a'), kind: 'calibration-run', version: PR.calibration.version, generatedAt: res.generatedAt, data: res, note: res.summary });
    STORE.log(store, { type: 'calibration', action: 'calibration-ladder', summary: res.summary, detail: 'Ladder artifact stored as calibration-run ' + PR.calibration.version + ' · parity ' + (res.parity.allOk ? 'PASS' : 'FAIL') });
    PR.derive.invalidate(); STORE.save(store);

    var html = '<div class="replay-report"><b>' + C.esc(res.summary) + '</b>';
    Object.keys(res.leagues).forEach(function (lg) {
      var L = res.leagues[lg];
      if (L.refused) { html += '<p class="ladder-note">⚠ ' + C.esc(lg + ' — ' + L.refused) + '</p>'; return; }
      html += '<p class="ladder-note"><b>' + C.esc(lg) + '</b> — train ' + L.trainRows + ' rows (' + C.esc(L.trainWindow[0]) + ' → ' + C.esc(L.trainWindow[1]) + ') · last season ' + L.lastSeasonRows + ' rows (' + C.esc(L.lastSeasonWindow[0]) + ' → ' + C.esc(L.lastSeasonWindow[1]) + ')</p>';
      html += '<table class="ladder-tbl"><thead><tr><th>holdout</th><th>n</th><th>refused</th><th>Brier DC</th><th>Brier base</th><th>gain</th><th>log loss</th><th>direction</th><th>cal max err</th><th>MDE80</th><th>t (df)</th><th>p</th></tr></thead><tbody>';
      L.ladder.forEach(function (r) {
        if (r.insufficient) { html += '<tr><td>' + C.esc(String(r.holdout)) + '</td><td colspan="11" class="dim">' + C.esc(r.reason) + '</td></tr>'; return; }
        var p = r.paired || {};
        html += '<tr' + (r.holdout === 'FULL' ? ' class="full"' : '') + '>' +
          '<td>' + C.esc(String(r.holdout)) + '</td><td>' + r.scored + '</td><td>' + r.refused + '</td>' +
          '<td>' + fmt4(r.brier_dc) + '</td><td>' + fmt4(r.brier_base) + '</td><td>' + fmt1(r.gain_pct) + '%</td>' +
          '<td>' + fmt4(r.logloss) + '</td><td>' + fmt1(r.dir_acc) + '%</td>' +
          '<td title="' + C.esc(r.calib_max_err ? (r.calib_max_err.side + ' bin ' + r.calib_max_err.binLo.toFixed(1) + '–' + r.calib_max_err.binHi.toFixed(1) + ', n ' + r.calib_max_err.n + ', mean ' + r.calib_max_err.meanPred.toFixed(3) + ' vs freq ' + r.calib_max_err.observedFreq.toFixed(3)) : '') + '">' + fmt4(r.calib_max_err && r.calib_max_err.err) + '</td>' +

var PR = window.PR;

function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* first boot: build the store from the embedded packs through the ONE ingest gate,
   then apply the migrated fitted model. Subsequent boots: load from localStorage. */
function boot() {
  var store = PR.store.load();
  var fromSeed = false;
  if (!store || !store.identities || !store.identities.length) {
    store = PR.store.empty();
    store.meta.createdAt = new Date().toISOString();
    fromSeed = true;
    SEED_PACKS.forEach(function (pack) {
      var parsed = PR.ingest.parsePack(pack.text);
      /* embedded legacy seeds (closure/HIB_MAL) carry the documented NA-code class
         (ZONES v0.14) — loaded lenient (strict:false); researcher packs stay strict.
         Seeds commit as system-seed (R2): logged type 'system' / action 'seed',
         never stamped ownerApproved. Mute rows keep their pack rationale (IA-01/02/03). */
      var legacySeed = pack.name === 'HIB_MAL_SEED_PACK.txt' || pack.name === 'MASTER_RECORD_CLOSURE_SEED_PACK.txt';
      var v = PR.ingest.validate(store, parsed, todayISO(), { strict: !legacySeed });
      if (v.ok) {
        PR.ingest.commit(store, v.staged, { packName: pack.name, seed: true, onCommitted: function () {} });
      } else {
        store.log.push({ seq: store.log.length + 1, type: 'system', action: 'seed-skip', summary: 'Seed pack ' + pack.name + ' not loaded: ' + v.errors.length + ' defect(s).', ts: new Date().toISOString() });
      }
    });
    store.meta.seedPacks = SEED_PACKS.map(function (p) { return p.name; });
  }
  /* B3 league pivot ensure */
  try{ ensureLeaguePivotArtifact(store); }catch(e){}
  /* fitted model migration (Phase 1: team/league attributes) */
  var fittedApplied = store.artifacts.some(function (a) { return a.kind === 'dc-fitted-model'; });
  if (!fittedApplied && window.__FITTED_MODEL__) {
    PR.dc.loadFitted(store, window.__FITTED_MODEL__);
    store.log.push({ seq: store.log.length + 1, type: 'system', action: 'fitted-migrate', summary: 'Fitted Dixon-Coles parameters migrated as team/league attributes.', ts: new Date().toISOString() });
  }

  /* R4: DC-vs-evidence gate verdict — fitted card enabled for a league ONLY when
     the masked replay (strict causality, split-half) shows the DC fit winning.
     The verdict artifact carries the numbers + validation date (provenance). */
  if (window.__DC_GATE__ && !store.artifacts.some(function (a) { return a.kind === 'dc-gate-validation'; })) {
    var gateArt = { id: PR.store.nextId(store, 'a'), kind: 'dc-gate-validation', version: '1', generatedAt: new Date().toISOString(), data: {} };
    var gateAny = false;
    Object.keys(window.__DC_GATE__).forEach(function (code) {
      var g = window.__DC_GATE__[code];
      if (g && g.win) { gateArt.data[code] = g; gateAny = true; }
    });
    if (gateAny) {
      store.artifacts.push(gateArt);
      store.log.push({ seq: store.log.length + 1, type: 'system', action: 'dc-gate', summary: 'DC fit replay-validated for: ' + Object.keys(gateArt.data).join(', ') + ' — fitted cards enabled with provenance.', ts: new Date().toISOString() });
    }
  }
  store.meta.updatedAt = new Date().toISOString();
  PR.store.save(store);
  var derived = PR.derive.derive(store, { engines: [function (s, d) { d.dcFit = PR.dc.fit(s); }] });
  PR.ui.render(store, derived);
  if (fromSeed) setTimeout(function () {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = 'Data loaded — ready.';
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200);
  }, 400);
}
